<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestion Menu - GreenBite Admin</title>
    <link rel="stylesheet" href="../style.css" />
    <link rel="stylesheet" href="css/admin.css" />
    <link
      rel="stylesheet"
      href="https://pro.fontawesome.com/releases/v5.10.0/css/all.css"
    />
  </head>
  <body>
    <!-- Navigation Admin -->
    <nav class="admin-nav">
      <div class="admin-nav-content">
        <h1>
          <span>G</span>reen<span>B</span>ite
          <span class="admin-badge">Admin</span>
        </h1>
        <ul>
          <li>
            <a href="dashboard.html"
              ><i class="fas fa-chart-line"></i> Dashboard</a
            >
          </li>
          <li>
            <a href="gestion.html" class="active"
              ><i class="fas fa-utensils"></i> Gestion Menu</a
            >
          </li>
          <li>
            <a href="#" onclick="logout()"
              ><i class="fas fa-sign-out-alt"></i> Déconnexion</a
            >
          </li>
        </ul>
      </div>
    </nav>

    <div class="admin-container">
      <div class="admin-header">
        <h2><i class="fas fa-utensils"></i> Gestion des Plats et Boissons</h2>
        <button class="btn-add" onclick="showAddModal()">
          <i class="fas fa-plus"></i> Ajouter un plat
        </button>
      </div>

      <!-- Filtres par catégorie -->
      <div class="filters">
        <h3><i class="fas fa-filter"></i> Filtrer par catégorie :</h3>
        <button class="filter-btn active" onclick="filterPlats('all')">
          Tous
        </button>
        <button class="filter-btn" onclick="filterPlats('plats')">Plats</button>
        <button class="filter-btn" onclick="filterPlats('boissons')">
          Boissons
        </button>
        <button class="filter-btn" onclick="filterPlats('desserts')">
          Desserts
        </button>
      </div>

      <!-- Grille des plats -->
      <div id="plats-grid" class="admin-plats-grid">
        <!-- Les plats seront chargés ici -->
      </div>
    </div>

    <!-- Modal Ajouter/Modifier Plat -->
    <div id="plat-modal" class="modal">
      <div class="modal-content modal-large">
        <span class="close" onclick="closePlatModal()">&times;</span>
        <h2 id="modal-title">Ajouter un plat</h2>

        <form id="plat-form">
          <input type="hidden" id="plat-id" />

          <div class="form-row">
            <div class="form-group">
              <label><i class="fas fa-utensils"></i> Nom du plat *</label>
              <input type="text" id="plat-name" required />
            </div>

            <div class="form-group">
              <label><i class="fas fa-tag"></i> Catégorie *</label>
              <select id="plat-category" required>
                <option value="">Choisir...</option>
                <option value="plats">Plats</option>
                <option value="boissons">Boissons</option>
                <option value="desserts">Desserts</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label><i class="fas fa-align-left"></i> Description *</label>
            <textarea id="plat-description" rows="3" required></textarea>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label><i class="fas fa-dollar-sign"></i> Prix (DT) *</label>
              <input type="number" id="plat-price" step="0.01" required />
            </div>

            <div class="form-group">
              <label><i class="fas fa-image"></i> Image (chemin) *</label>
              <input
                type="text"
                id="plat-image"
                placeholder="images/plat1.jpg"
                required
              />
            </div>
          </div>

          <div class="form-group">
            <label><i class="fas fa-check-circle"></i> Caractéristiques:</label>
            <div class="checkbox-group">
              <label class="checkbox-label">
                <input type="checkbox" id="sans-gluten" />
                <span>Sans gluten</span>
              </label>
              <label class="checkbox-label">
                <input type="checkbox" id="sans-lactose" />
                <span>Sans lactose</span>
              </label>
              <label class="checkbox-label">
                <input type="checkbox" id="bio" />
                <span>Bio</span>
              </label>
            </div>
          </div>

          <div class="form-group">
            <label
              ><i class="fas fa-plus-circle"></i> Suppléments
              disponibles:</label
            >
            <div id="supplements-container">
              <!-- Les suppléments seront ajoutés ici -->
            </div>
            <button
              type="button"
              class="btn-secondary"
              onclick="addSupplementField()"
            >
              <i class="fas fa-plus"></i> Ajouter un supplément
            </button>
          </div>

          <div class="form-group">
            <label
              ><i class="fas fa-utensils"></i> Accompagnements
              disponibles:</label
            >
            <div id="accompagnements-container">
              <!-- Les accompagnements seront ajoutés ici -->
            </div>
            <button
              type="button"
              class="btn-secondary"
              onclick="addAccompagnementField()"
            >
              <i class="fas fa-plus"></i> Ajouter un accompagnement
            </button>
          </div>

          <div class="form-actions">
            <button type="button" class="btn-cancel" onclick="closePlatModal()">
              Annuler
            </button>
            <button type="submit" class="btn-save">
              <i class="fas fa-save"></i> Enregistrer
            </button>
          </div>
        </form>
      </div>
    </div>

    <script src="../js/admin.js"></script>
    <script>
      checkAuth();
      loadPlats();
    </script>
  </body>
</html>
